services:
  mongo:
    image: mongo:7
    container_name: brasa-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    environment:
      PORT: ${PORT}
      MONGO_URI: ${MONGO_URI}
      WHATSAPP_PHONE: ${WHATSAPP_PHONE}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      - mongo
    ports:
      - "5050:5050"

  web:
    build:
      context: .
      dockerfile: ./web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - api
    ports:
      - "4173:4173"

volumes:
  mongo-data:
